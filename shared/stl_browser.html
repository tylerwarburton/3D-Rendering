<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STL Browser</title>
<style>
:root{--bg:#0f1d25;--panel:#152731;--item:#1b3340;--hi:#2a5468;--fg:#dfe9ee;--dim:#8fa6b1;--bad:#ff6b5b;--ok:#6fd08c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
#app{display:flex;height:100%}
#side{width:300px;min-width:220px;background:var(--panel);display:flex;flex-direction:column}
#side header{padding:12px}
#side h1{font-size:16px;margin:0 0 8px}
#side h1 a{color:var(--dim);text-decoration:none;font-weight:400;font-size:13px;margin-left:6px}
input,select,button{font:inherit;color:var(--fg);background:var(--item);border:1px solid #2c4a58;border-radius:6px;padding:6px 8px}
#q{width:100%}
#list{overflow:auto;flex:1;padding:0 8px 12px}
.grp{color:var(--dim);font-size:12px;margin:12px 4px 4px;text-transform:uppercase;letter-spacing:.04em}
.it{padding:6px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it:hover{background:var(--item)} .it.on{background:var(--hi)}
#main{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;height:100%}
#info{position:absolute;left:12px;top:12px;background:rgba(21,39,49,.88);padding:10px 12px;border-radius:8px;line-height:1.6;max-width:calc(100% - 24px)}
#info b{font-size:15px}
#tools{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bad{color:var(--bad)} .ok{color:var(--ok)} .dim{color:var(--dim)}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(42,84,104,.55);font-size:20px;border:3px dashed var(--fg)}
@media (max-width:700px){#app{flex-direction:column}#side{width:auto;height:38%}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>STL browser <a href="/">home</a></h1>
      <input id="q" placeholder="filter… (or drop .stl files anywhere)">
    </header>
    <div id="list"></div>
  </aside>
  <main id="main">
    <canvas id="cv"></canvas>
    <div id="info" class="dim">Pick a part, or drop STL files on the page.</div>
    <div id="tools">
      <select id="bed" title="Build plate">
        <option value="256">Bed 256 mm (X1/P1/A1)</option>
        <option value="180">Bed 180 mm (A1 mini)</option>
      </select>
      <button id="ov" title="Faces steeper than 45° that face down, above the bed">Overhangs: on</button>
      <button id="fit">Reset view</button>
    </div>
    <div id="drop">Drop STL files</div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
const PLA = 1.24, OVER = Math.cos(Math.PI / 4) + 1e-3;   // g/cm3; 45 deg limit (exact 45 is fine)
const cv = document.getElementById('cv'), info = document.getElementById('info');
const renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true});
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f1d25);
const cam = new THREE.PerspectiveCamera(40, 1, 1, 5000); cam.up.set(0, 0, 1);
const ctl = new THREE.OrbitControls(cam, cv);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(1, -1.5, 2); scene.add(sun);
let bed = null, mesh = null, showOver = true, cur = null;

function makeBed(s){
  if(bed) scene.remove(bed);
  bed = new THREE.Group();
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({color: 0x1a2c36}));
  plate.position.z = -0.05; bed.add(plate);
  const grid = new THREE.GridHelper(s, s / 10, 0x3d5a68, 0x24404d); grid.rotation.x = Math.PI / 2; bed.add(grid);
  scene.add(bed);
}

function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);

function volume(pos){                       // signed tetra sum, mm3
  let v = 0;
  for(let i = 0; i < pos.length; i += 9){
    const [ax, ay, az, bx, by, bz, cx, cy, cz] = pos.subarray(i, i + 9);
    v += ax * (by * cz - bz * cy) - ay * (bx * cz - bz * cx) + az * (bx * cy - by * cx);
  }
  return Math.abs(v) / 6;
}

function colorize(g){
  const pos = g.attributes.position.array, n = g.attributes.normal.array, z0 = g.boundingBox.min.z;
  const col = new Float32Array(pos.length); let area = 0;
  for(let i = 0; i < pos.length; i += 9){
    const zc = (pos[i + 2] + pos[i + 5] + pos[i + 8]) / 3;
    const bad = showOver && n[i + 2] < -OVER && zc > z0 + 0.2;
    const c = bad ? [1, .42, .36] : [.78, .84, .88];
    for(let k = 0; k < 9; k += 3) col.set(c, i + k);
    if(bad){
      const a = new THREE.Vector3(pos[i], pos[i+1], pos[i+2]), b = new THREE.Vector3(pos[i+3], pos[i+4], pos[i+5]),
            c2 = new THREE.Vector3(pos[i+6], pos[i+7], pos[i+8]);
      area += b.sub(a).cross(c2.sub(a)).length() / 2;
    }
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return area;
}

function show(buf, name){
  const g = new THREE.STLLoader().parse(buf);
  g.computeVertexNormals(); g.computeBoundingBox();
  const bb = g.boundingBox, c = new THREE.Vector3(); bb.getCenter(c);
  g.translate(-c.x, -c.y, -bb.min.z); g.computeBoundingBox();   // centred, on the bed
  const over = colorize(g);
  if(mesh){ scene.remove(mesh); mesh.geometry.dispose(); }
  mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors: true, roughness: .7, metalness: 0, side: THREE.DoubleSide}));
  scene.add(mesh);
  cur = {name, g, over};
  report(); fitView();
}

function report(){
  if(!cur) return;
  const s = +document.getElementById('bed').value, d = new THREE.Vector3(); cur.g.boundingBox.getSize(d);
  const v = volume(cur.g.attributes.position.array) / 1000, tris = cur.g.attributes.position.count / 3;
  const fits = d.x <= s && d.y <= s && d.z <= s;
  info.className = '';
  info.innerHTML = `<b>${cur.name}</b><br>
    ${d.x.toFixed(1)} × ${d.y.toFixed(1)} × ${d.z.toFixed(1)} mm
    <span class="${fits ? 'ok' : 'bad'}">${fits ? 'fits bed' : 'too big for bed'}</span><br>
    ${v.toFixed(1)} cm³ · ~${(v * PLA).toFixed(0)} g PLA solid · ${tris.toLocaleString()} tris<br>
    <span class="${cur.over > 1 ? 'bad' : 'ok'}">overhang &gt;45°: ${cur.over.toFixed(0)} mm²</span>
    <span class="dim">(as loaded, flat side down)</span>`;
}

function fitView(){
  const s = +document.getElementById('bed').value;
  const r = mesh ? mesh.geometry.boundingBox.getBoundingSphere(new THREE.Sphere()).radius : s / 2;
  const h = mesh ? mesh.geometry.boundingBox.max.z / 2 : 0;
  ctl.target.set(0, 0, h);
  cam.position.set(r * 1.6, -r * 2.4, h + r * 1.6);
  cam.near = r / 100; cam.far = r * 40 + s * 4; cam.updateProjectionMatrix(); ctl.update();
}

// every .stl under out/, listed by serve.py
let items = [];
function renderList(){
  const q = document.getElementById('q').value.toLowerCase(), L = document.getElementById('list');
  L.innerHTML = ''; let last = null;
  items.filter(it => it.path.toLowerCase().includes(q)).forEach(it => {
    const i = it.path.lastIndexOf('/'), dir = i < 0 ? '(top)' : it.path.slice(0, i);
    if(dir !== last){ const h = document.createElement('div'); h.className = 'grp'; h.textContent = dir; L.append(h); last = dir; }
    const e = document.createElement('div'); e.className = 'it'; e.title = it.path;
    e.textContent = it.path.slice(i + 1);
    e.onclick = () => openUrl(it, e);
    if(cur && cur.name === it.path.slice(i + 1)) e.classList.add('on');
    L.append(e);
  });
}
async function openUrl(it, el){
  document.querySelectorAll('.it.on').forEach(x => x.classList.remove('on')); el.classList.add('on');
  info.className = 'dim'; info.textContent = 'Loading ' + it.path + '…';
  const name = it.path.slice(it.path.lastIndexOf('/') + 1);
  if(it.file) return show(await it.file.arrayBuffer(), name);
  const r = await fetch('/' + it.path.split('/').map(encodeURIComponent).join('/'));
  show(await r.arrayBuffer(), name);
  history.replaceState(null, '', '#' + it.path);
}
fetch('/api/stls').then(r => r.json()).then(j => {
  items = j; renderList();
  const want = decodeURIComponent(location.hash.slice(1));
  const hit = [...document.querySelectorAll('.it')].find(e => e.title === want);
  if(hit) hit.click();
  else if(want){ document.getElementById('q').value = want; renderList(); }   // #project/ = filter
}).catch(() => { document.getElementById('list').innerHTML = '<p class="dim">Run <code>python serve.py</code> to list out/ — drag-and-drop still works.</p>'; });
document.getElementById('q').oninput = renderList;

/* drag and drop: any STL from disk */
const drop = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; });
addEventListener('dragleave', e => { if(!e.relatedTarget) drop.style.display = 'none'; });
addEventListener('drop', async e => {
  e.preventDefault(); drop.style.display = 'none';
  const files = [...e.dataTransfer.files].filter(f => /\.stl$/i.test(f.name));
  files.forEach(f => items.unshift({path: 'dropped/' + f.name, file: f}));
  renderList();
  if(files[0]) show(await files[0].arrayBuffer(), files[0].name);
});

document.getElementById('bed').onchange = e => { makeBed(+e.target.value); report(); };
document.getElementById('ov').onclick = e => {
  showOver = !showOver; e.target.textContent = 'Overhangs: ' + (showOver ? 'on' : 'off');
  if(cur){ cur.over = colorize(cur.g); report(); }
};
document.getElementById('fit').onclick = fitView;

makeBed(256); resize(); fitView();
(function loop(){ requestAnimationFrame(loop); renderer.render(scene, cam); })();
</script>
</body>
</html>
